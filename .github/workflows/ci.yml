# 持续集成：共享资料同步检查、skill 校验、单元测试、提示词版一致性检查
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx openpyxl

      - name: 共享资料同步检查
        run: python tools/sync_shared.py --check

      - name: 校验 skill
        run: python tools/validate.py

      - name: 单元测试
        run: python -m unittest discover -s tests -t .

      - name: 提示词版一致性检查
        run: python tools/build_prompts.py --check
