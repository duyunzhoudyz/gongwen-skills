name: 测试反馈
description: 用虚构材料试用后发现的问题，或者觉得好用的地方；字段与 docs/评测/测试记录表.csv 一致
title: "[测试反馈] "
labels: ["测试反馈"]
body:
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      description: 涉密信息严禁输入任何联网 AI 工具，也不要贴在这里。没有勾选，不能提交。
      options:
        - label: 我确认提交内容不含涉密信息和真实个人信息
          required: true
        - label: 我用的是虚构材料，单位、人名、数字和文号都已虚构或脱敏
          required: true

  - type: markdown
    attributes:
      value: |
        一个问题填一份。填写方法、必测场景和脱敏做法见 [测试者手册](https://github.com/duyunzhoudyz/gongwen-skills/blob/main/docs/%E8%AF%84%E6%B5%8B/%E6%B5%8B%E8%AF%95%E8%80%85%E6%89%8B%E5%86%8C.md)。
        截图请先涂黑遮挡，再上传。规则本身写错了（与国标或条例原文不符）的，请改用“规则纠错”表单。

  - type: dropdown
    id: tester_role
    attributes:
      label: 测试者角色
      options:
        - 新入职的文字工作者
        - 专职笔杆子
        - 兼职写材料的业务骨干
        - 审稿的领导或中层
        - 党务宣传岗
        - 其他
    validations:
      required: true

  - type: dropdown
    id: unit_type
    attributes:
      label: 单位类型
      options:
        - 党政机关
        - 基层（乡镇、街道、社区）
        - 公立医院
        - 高校
        - 中小学
        - 国有企业
        - 其他事业单位
        - 其他
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: 使用的工具
      options:
        - Claude Code
        - OpenAI Codex
        - Cursor
        - Gemini CLI
        - GitHub Copilot
        - Qwen Code
        - Kimi Code CLI
        - CodeBuddy
        - Trae
        - 网页大模型（提示词版）
        - 内网模型（离线包）
        - 其他（请在备注中说明）
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 模型
      description: 具体的模型名称，不知道版本就写网页上显示的名字。
      placeholder: 例如 DeepSeek-V3，或 Kimi，或 Qwen3
    validations:
      required: true

  - type: dropdown
    id: skill
    attributes:
      label: 涉及的 skill
      options:
        - 不确定
        - gongwen（总入口）
        - gongwen-profile
        - gongwen-draft
        - gongwen-report
        - gongwen-speech
        - gongwen-party
        - gongwen-brief
        - gongwen-minutes
        - gongwen-implement
        - gongwen-rectify
        - gongwen-title
        - gongwen-polish
        - gongwen-humanize
        - gongwen-direct
        - gongwen-review
        - gongwen-format
        - gongwen-data
        - gongwen-grassroots（行业包）
        - gongwen-hospital（行业包）
        - gongwen-university（行业包）
        - gongwen-k12（行业包）
        - gongwen-soe（行业包）
    validations:
      required: true

  - type: textarea
    id: saying
    attributes:
      label: 用户说法（已脱敏）
      description: 你对它说的话，原样写。长材料不用贴，写一句概括，如“附材料：某科室工作记录，约 800 字，缺平均住院日”。
      placeholder: 例如 帮我写个信息工作总结，1500 字左右，记录发你。
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: 问题类型
      description: 选主要的一个。没发现问题、只想记录好用的地方，选“无”。
      options:
        - 编造（输出了材料里没有的数字、人名、事例、依据）
        - 格式（符号、序号、日期、标点、文号、Word 版式）
        - 文种（文种或行文方向不对）
        - 语气（口气不对、AI 腔重、免责声明、建议式部署）
        - 篇幅（明显过长或过短、注水）
        - 保密（该提醒没提醒，或个人信息没有脱敏）
        - 触发错误（该用的 skill 没用上，或用错了）
        - 其他
        - 无
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重度
      description: 高是稿子不能直接用，如编造事实、涉密标记没提醒、文种错到不能用；中是要明显返工；低是小瑕疵或个人偏好。拿不准选低一级。
      options:
        - 高
        - 中
        - 低
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: 是否可复现
      description: 同一个说法多试一两次，看是否每次都出现。
      options:
        - 每次都出现
        - 偶尔出现
        - 只试了一次
    validations:
      required: true

  - type: textarea
    id: excerpt
    attributes:
      label: 截图或摘录（已脱敏）
      description: 出问题的那一两句话，原样摘录，不超过 200 字。贴截图前先涂黑遮挡。
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 建议
      description: 你觉得应该怎么改，越具体越好，如“应该标【待补】”“这里应该用函”。没想法可以不填。
    validations:
      required: false

  - type: textarea
    id: remark
    attributes:
      label: 备注
      description: 其他想说的，如是否开了联网或深度思考，Word、WPS 的版本，系统版本。
    validations:
      required: false
