<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;background:#F7F4EE;color:#2B2B2B;position:relative}
/* 如存在 bg.png（AI 生成的无字背景），铺在最底层 */
.bg{position:absolute;inset:0;background:url("bg.png") center/cover no-repeat}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,244,238,.96) 0%,rgba(247,244,238,.88) 52%,rgba(247,244,238,.2) 100%)}
.bar{position:absolute;left:0;top:0;width:12px;height:100%;background:#B3282D}
.left{position:absolute;left:80px;top:78px;width:700px}
.eyebrow{font-size:22px;letter-spacing:4px;color:#B3282D;font-weight:700}
h1{font-size:92px;line-height:1.1;margin-top:18px;font-weight:900;letter-spacing:2px}
h1 span{color:#B3282D}
.sub{font-size:31px;line-height:1.5;margin-top:26px;color:#2B2B2B}
.sub b{color:#B3282D}
.pills{display:flex;gap:14px;margin-top:38px}
.pill{white-space:nowrap;font-size:20px;padding:9px 20px;border:2px solid #2B2B2B;border-radius:40px;background:rgba(255,255,255,.7);font-weight:600}
.pill.red{background:#B3282D;border-color:#B3282D;color:#fff}
.foot{position:absolute;left:80px;bottom:44px;font-size:21px;color:#6b6358;letter-spacing:1px}
.doc{position:absolute;right:70px;top:46px;width:430px;transform:rotate(3.5deg);box-shadow:0 24px 50px rgba(60,30,20,.28),0 3px 8px rgba(0,0,0,.15);border-radius:4px;overflow:hidden;background:#fff}
.doc img{display:block;width:100%}
.doc2{position:absolute;right:360px;top:150px;width:330px;transform:rotate(-5deg);box-shadow:0 18px 40px rgba(60,30,20,.22);border-radius:4px;overflow:hidden;background:#fff;opacity:.0}
.badge{position:absolute;right:46px;bottom:56px;background:#2B2B2B;color:#fff;font-size:22px;padding:10px 20px;border-radius:8px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.badge em{font-style:normal;color:#E8B84B}
</style></head><body>
<div class="bg"></div><div class="veil"></div><div class="bar"></div>
<div class="left">
  <div class="eyebrow">GONGWEN-SKILLS</div>
  <h1>公文 <span>Skills</span></h1>
  <div class="sub">AI 写公文，<b>不编造、守保密</b>，<br>一键输出 GB/T 9704 国标 Word</div>
  <div class="pills"><div class="pill red">22 个 Skills</div><div class="pill">Claude Code · Codex · Cursor</div><div class="pill">网页版可用</div></div>
</div>
<div class="foot">github.com/duyunzhoudyz/gongwen-skills</div>
<div class="doc"><img src="sample-b.png"></div>
<div class="badge">版式审计 <em>97.2</em> 分 · 同类第一</div>
</body></html>
